name: GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build public site
        run: |
          mkdir -p _site/assets/brand
          cp site/index.html site/site.css site/theme.js docs/images/demo-flow.png docs/images/demo-flow-light.png AGENT_GUIDE.md _site/
          brand=internal/render/frontend/src/assets/brand
          cp "$brand"/lockup-*.svg "$brand"/favicon.svg "$brand"/favicon.ico "$brand"/apple-touch-icon.png "$brand"/social-preview.png _site/assets/brand/
          go run ./site/render site/demo.graph.json > _site/demo.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
